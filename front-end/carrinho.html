<!DOCTYPE html>
<!-- Começo da pág do carrinho, onde ficam os produtos q a pessoa escolheu. - Adicionado por Guilherme Bento. -->
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evonium - Carrinho</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header padrão com a marca e a navegação do site. - Adicionado por Guilherme Bento. -->
    <header class="topo">
        <a href="index.html" class="marca">
            <img src="../assets/Logo_Evonium.png" alt="Logo Evonium">
            <b>Evonium</b>
        </a>
        <!-- Menu pra trocar entre as págs do projeto. - Adicionado por Guilherme Bento. -->
        <nav>
      <a href="index.html">Inicio</a>
      <a href="produtos.html">Produtos</a>
      <a href="contato.html">Contatos</a>
      <a href="sobre.html">Sobre nós</a>
      <a href="equipe.html">Equipe</a>
      <a href="carrinho.html">Carrinho</a>
    </nav>
    </header>

    <!-- Conteúdo principal da pág do carrinho. - Adicionado por Guilherme Bento. -->
    <main>
        <!-- Título simples pra mostrar q o usuário tá no carrinho. - Adicionado por Guilherme Bento. -->
        <section class="cabecalho-pagina">
            <h1>Carrinho</h1>
            <!-- Deixei esse cabeçalho simples pq o carrinho já explica oq precisa logo abaixo. - Adicionado por Guilherme Bento. -->
        </section>

        <!-- Área q mostra os itens escolhidos e o resumo da compra. - Adicionado por Guilherme Bento. -->
        <section class="carrinho-area">
            <div>
                <h2>Itens escolhidos</h2>
                <!-- Esse id é usado pelo JS pra colocar os itens do carrinho na tela. - Adicionado por Guilherme Bento. -->
                <div id="itens-carrinho"></div>
            </div>
            <!-- Resumo da compra com total e botões pra finalizar ou limpar. - Adicionado por Guilherme Bento. -->
            <aside class="resumo">
                <h2>Resumo</h2>
                <p>Total: <strong id="total-carrinho">R$ 0,00</strong></p>
                <button id="btn-finalizar" class="botao">Finalizar compra</button>
                <button id="btn-limpar" class="botao secundario">Limpar carrinho</button>
                <p id="mensagem-carrinho" class="mensagem"></p>
            </aside>
        </section>
    </main>

    <!-- Rodapé da pág com a assinatura da Evonium. - Adicionado por Guilherme Bento. -->
    <footer>
        <p>Evonium - Since 2026</p>
    </footer>

    <!-- JS q cuida do carrinho e da finalização simulada. - Adicionado por Guilherme Bento. -->
    <script src="js/app.js"></script>
</body>
</html>
